<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The brand mark, redrawn for 16px rather than scaled down to it. The
       double ring and the four veins of docs/brand/heirloom-mark.svg both
       collapse into mud at this size, so the ring is single and the veins are
       gone; what survives is the silhouette, the midrib and the brass seed. -->
  <rect width="32" height="32" rx="7" fill="#241B12"/>
  <circle cx="16" cy="16" r="13" fill="none" stroke="#C9A227" stroke-width="1.4" opacity=".65"/>
  <path d="M16 5.6 A11.2 11.2 0 0 1 16 26.4 A11.2 11.2 0 0 1 16 5.6Z" fill="#F0E6CE"/>
  <path d="M16 8.4 V23" stroke="#241B12" stroke-width="1.7" stroke-linecap="round"/>
  <circle cx="16" cy="21.4" r="2.5" fill="#C9A227"/>
</svg>
