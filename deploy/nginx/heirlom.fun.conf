# HEIRLOM — Nginx site for heirlom.fun
#
# Install:
#   sudo cp deploy/nginx/heirlom.fun.conf /etc/nginx/sites-available/heirlom.fun
#   sudo ln -sf /etc/nginx/sites-available/heirlom.fun /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot add TLS to this file:
#   sudo certbot --nginx -d heirlom.fun -d www.heirlom.fun
#
# One origin serves both apps: Next on :3000 and Fastify on :4000. That is not
# cosmetic — same origin means the browser never makes a cross-origin request,
# so CORS and its preflights stop being part of the login path at all.

upstream heirlom_web { server 127.0.0.1:3000; keepalive 32; }
upstream heirlom_api { server 127.0.0.1:4000; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name heirlom.fun www.heirlom.fun;

    # Uploads are small; specimen art is drawn, never uploaded.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # www is a redirect, not a second home, so links and OG cards resolve to one
    # canonical origin.
    if ($host = www.heirlom.fun) { return 308 https://heirlom.fun$request_uri; }

    # ---- the API ----------------------------------------------------------
    # The server runs with `trustProxy: true` and its rate limiter falls back to
    # req.ip for anonymous requests. Without X-Forwarded-For every visitor would
    # arrive as 127.0.0.1 and share ONE 240/min bucket — meaning a single bot
    # could rate-limit the login endpoint for everybody. These headers are
    # load-bearing; do not drop them.
    location /api/ {
        proxy_pass http://heirlom_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
    }

    # Health lives at the root, outside /api, so it needs its own location or it
    # would fall through to Next and always answer 404.
    location = /health {
        proxy_pass http://heirlom_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---- the game ---------------------------------------------------------
    # Next fingerprints everything under /_next/static, so it is safe to cache
    # hard and it takes the bulk of the bytes off the origin.
    location /_next/static/ {
        proxy_pass http://heirlom_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://heirlom_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
    }
}
